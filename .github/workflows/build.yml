name: Build dist

# Rebuilds dist/kt.css and dist/kt.min.css from css/ on every push to main
# and commits them back, so GitHub Pages always serves a current bundle.
# Pushes made with GITHUB_TOKEN do not trigger workflows, so this cannot loop.

on:
  push:
    branches: [main]
    paths:
      - 'css/**'
      - 'scripts/build.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bundle
        run: node scripts/build.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- dist; then
            echo "dist is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Build dist from ${GITHUB_SHA::7}"
          git push
